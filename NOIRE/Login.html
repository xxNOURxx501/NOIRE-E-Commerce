<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login · NOIRÉ</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
        /* ===== NOIRÉ LOGIN STYLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0B0710;
            color: #F5F1F7;
            font-family: 'Poppins', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-wrapper {
            width: 100%;
            max-width: 450px;
            padding: 2rem;
        }
        .login-card {
            background: #15101B;
            border-radius: 30px;
            padding: 3rem 2.5rem;
            border: 1px solid #2A1938;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        .brand-logo {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            text-align: center;
            color: #F5F1F7;
            text-decoration: none;
            display: block;
            margin-bottom: 0.5rem;
            letter-spacing: 3px;
        }
        .brand-logo span {
            color: #7D3C98;
        }
        .brand-subtitle {
            text-align: center;
            color: #D1C4E9;
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-bottom: 2rem;
            font-weight: 300;
        }
        .form-control {
            background: #0B0710;
            border: 1px solid #2A1938;
            color: #F5F1F7;
            border-radius: 12px;
            padding: 0.8rem 1rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            background: #0B0710;
            border-color: #7D3C98;
            box-shadow: 0 0 0 3px rgba(125, 60, 152, 0.15);
            color: #F5F1F7;
        }
        .form-control::placeholder {
            color: #6b5a7a;
            font-weight: 300;
        }
        .form-control.is-invalid {
            border-color: #e74c6f;
        }
        .form-label {
            color: #D1C4E9;
            font-weight: 400;
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
        }
        .btn-login {
            background: #564076;
            border: none;
            color: #F5F1F7;
            font-weight: 500;
            padding: 0.8rem;
            border-radius: 12px;
            width: 100%;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            font-size: 1rem;
        }
        .btn-login:hover {
            background: #7D3C98;
            color: #F5F1F7;
            box-shadow: 0 0 30px rgba(125, 60, 152, 0.25);
            transform: translateY(-2px);
        }
        .auth-link {
            color: #7D3C98;
            text-decoration: none;
            font-weight: 400;
            transition: color 0.2s;
        }
        .auth-link:hover {
            color: #A1547A;
            text-decoration: underline;
        }
        .text-muted-light {
            color: #D1C4E9;
            font-size: 0.9rem;
        }
        .error-message {
            color: #e74c6f;
            font-size: 0.85rem;
            margin-top: 0.3rem;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .password-toggle {
            position: relative;
        }
        .password-toggle .toggle-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6b5a7a;
            transition: color 0.2s;
            background: none;
            border: none;
            padding: 0;
        }
        .password-toggle .toggle-icon:hover {
            color: #D1C4E9;
        }
        .back-to-home {
            display: inline-block;
            color: #6b5a7a;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
            margin-top: 1rem;
        }
        .back-to-home:hover {
            color: #D1C4E9;
        }
        .back-to-home i {
            margin-right: 0.5rem;
        }
        .candle-glow {
            position: fixed;
            bottom: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(125, 60, 152, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
        }
        .candle-glow-2 {
            position: fixed;
            top: -150px;
            left: -150px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(125, 60, 152, 0.03) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
        }
        @media (max-width: 576px) {
            .login-card {
                padding: 2rem 1.5rem;
            }
            .brand-logo {
                font-size: 2rem;
            }
            .login-wrapper {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Background glow effects -->
    <div class="candle-glow"></div>
    <div class="candle-glow-2"></div>

    <div class="login-wrapper">
        <div class="login-card">
            <!-- Brand -->
            <a href="NOIRE/home.html" class="brand-logo">NOIR<span>É</span></a>
            <p class="brand-subtitle">WELCOME BACK</p>

            <!-- Login Form -->
            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="loginEmail" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="loginEmail" placeholder="admin@noire.com" value="admin@noire.com" />
                    <div class="error-message" id="emailError">No account found with this email.</div>
                </div>

                <div class="mb-3">
                    <label for="loginPassword" class="form-label">Password</label>
                    <div class="password-toggle">
                        <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" value="admin123" />
                        <button type="button" class="toggle-icon" id="togglePassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="error-message" id="passwordError">Incorrect password. Please try again.</div>
                </div>

                <div class="mb-3 d-flex justify-content-between align-items-center">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe" style="background-color:#0B0710; border-color:#2A1938;" />
                        <label class="form-check-label text-muted-light" for="rememberMe" style="font-size:0.85rem;">Remember me</label>
                    </div>
                    <a href="#" class="auth-link" style="font-size:0.85rem;">Forgot password?</a>
                </div>

                <button type="submit" class="btn-login">LOG IN</button>

                <div class="text-center mt-4">
                    <p class="text-muted-light" style="margin-bottom:0.3rem;">
                        Don't have an account?
                        <a href="NOIRE/signup.html" class="auth-link">Create one</a>
                    </p>
                </div>

                <div class="text-center mt-2">
                    <a href="NOIRE/home.html" class="back-to-home">
                        <i class="bi bi-arrow-left"></i> Back to Home
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ===== LOGIN LOGIC =====

        // ----- ENSURE DEFAULT ADMIN EXISTS -----
        function ensureAdminExists() {
            let users = JSON.parse(localStorage.getItem('noireUsers')) || [];
            const adminExists = users.some(u => u.email === 'admin@noire.com');
            if (!adminExists) {
                users.push({
                    id: Date.now(),
                    name: 'Admin',
                    email: 'admin@noire.com',
                    password: 'admin123',
                    isAdmin: true
                });
                localStorage.setItem('noireUsers', JSON.stringify(users));
                console.log('✅ Default admin created: admin@noire.com / admin123');
            }
        }

        // ----- ENSURE DEFAULT PRODUCTS EXIST -----
        function ensureProductsExist() {
            let products = JSON.parse(localStorage.getItem('noireProducts'));
            if (!products || products.length === 0) {
                const defaultProducts = [
                    { id: 1, title: "Midnight Vanilla", description: "Vanilla · Amber · Musk", price: 24, image: "NOIRE/images/Midnight Vanilla.jpeg", category: "Warm" },
                    { id: 2, title: "Lavender Smoke", description: "Lavender · Cedar · Vanilla", price: 26, image: "NOIRE/images/Lavender Smoke.jpeg", category: "Calm" },
                    { id: 3, title: "Dark Rose", description: "Rose · Oud · Amber", price: 28, image: "NOIRE/images/Rose.jpeg", category: "Romantic" },
                    { id: 4, title: "Sea Salt & Sage", description: "Sea salt · Sage · Citrus", price: 22, image: "NOIRE/images/Sea Salt.jpeg", category: "Fresh" },
                    { id: 5, title: "Ember & Oak", description: "Smoke · Oak · Vanilla", price: 27, image: "NOIRE/images/Ember.jpeg", category: "Warm" },
                    { id: 6, title: "White Tea & Mint", description: "White tea · Mint · Lime", price: 21, image: "NOIRE/images/White Tea.jpeg", category: "Fresh" },
                    { id: 7, title: "Velvet Orchid", description: "Orchid · Plum · Sandalwood", price: 30, image: "NOIRE/images/Velvet Orchid.jpeg", category: "Romantic" },
                    { id: 8, title: "Chamomile & Honey", description: "Chamomile · Honey · Oat", price: 23, image: "NOIRE/images/Chamomile & Honey.jpeg", category: "Calm" },
                    { id: 9, title: "Smoked Cinnamon", description: "Cinnamon · Clove · Orange", price: 25, image: "NOIRE/images/Smoked Cinnamon.jpeg", category: "Warm" },
                    { id: 10, title: "Cypress & Rain", description: "Cypress · Rain · Moss", price: 22, image: "NOIRE/images/Rain.png", category: "Fresh" },
                    { id: 11, title: "Saffron & Rose", description: "Saffron · Rose · Leather", price: 29, image: "NOIRE/images/Saffron.jpeg", category: "Romantic" },
                    { id: 12, title: "Lavender Dream", description: "Lavender · Vanilla · Tonka", price: 24, image: "NOIRE/images/Lavender Dream.jpeg", category: "Calm" }
                ];
                localStorage.setItem('noireProducts', JSON.stringify(defaultProducts));
                console.log('✅ Default products created.');
            }
        }

        // ----- RUN INITIALIZATION -----
        ensureAdminExists();
        ensureProductsExist();

        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('loginPassword');
            const icon = this.querySelector('i');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        });

        // Handle login form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('loginEmail');
            const password = document.getElementById('loginPassword');
            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');

            let isValid = true;

            // Reset errors
            emailError.classList.remove('show');
            passwordError.classList.remove('show');
            email.classList.remove('is-invalid');
            password.classList.remove('is-invalid');

            // Validate email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email.value.trim() || !emailRegex.test(email.value.trim())) {
                emailError.textContent = 'Please enter a valid email address.';
                emailError.classList.add('show');
                email.classList.add('is-invalid');
                isValid = false;
            }

            // Validate password
            if (!password.value.trim() || password.value.trim().length < 6) {
                passwordError.textContent = 'Password must be at least 6 characters.';
                passwordError.classList.add('show');
                password.classList.add('is-invalid');
                isValid = false;
            }

            if (!isValid) {
                return;
            }

            // Get users from localStorage
            const users = JSON.parse(localStorage.getItem('noireUsers')) || [];

            // Find user
            const foundUser = users.find(u =>
                u.email.toLowerCase() === email.value.trim().toLowerCase() &&
                u.password === password.value.trim()
            );

            if (foundUser) {
                // Save current user
                localStorage.setItem('noireCurrentUser', JSON.stringify(foundUser));

                // Show success message
                alert('Welcome back, ' + foundUser.name + '! 🕯️');

                // Redirect to home
                window.location.href = 'NOIRE/home.html';
            } else {
                // Check if email exists
                const emailExists = users.some(u => u.email.toLowerCase() === email.value.trim().toLowerCase());
                if (emailExists) {
                    passwordError.textContent = 'Incorrect password. Please try again.';
                    passwordError.classList.add('show');
                    password.classList.add('is-invalid');
                } else {
                    emailError.textContent = 'No account found with this email.';
                    emailError.classList.add('show');
                    email.classList.add('is-invalid');
                }
            }
        });

        // Clear validation on input
        document.querySelectorAll('.form-control').forEach(input => {
            input.addEventListener('input', function() {
                this.classList.remove('is-invalid');
                const parent = this.closest('.mb-3');
                if (parent) {
                    const errorEl = parent.querySelector('.error-message');
                    if (errorEl) {
                        errorEl.classList.remove('show');
                    }
                }
            });
        });

        // Check if user is already logged in
        const currentUser = JSON.parse(localStorage.getItem('noireCurrentUser'));
        if (currentUser) {
            console.log('Already logged in as:', currentUser.name);
        }
    </script>
</body>
</html>
